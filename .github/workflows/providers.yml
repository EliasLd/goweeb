name: Provider checks

# Live health checks for the source providers: every provider walks
# one real chapter through the whole PDF pipeline against its actual
# website (see internal/e2e). These are informational checks, not
# merge gates: runner IPs face bot protection on some sites, and
# live sites break for operational reasons that no code change can
# fix. They are never triggered on push or pull requests.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC, default branch only

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    name: ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    continue-on-error: ${{ matrix.edge_block_expected == true }}

    strategy:
      fail-fast: false
      matrix:
        provider:
          - animesama
          - atsumoe
          - mangaball
          - mangafreak
          - weebcentral
          - mangadex
          - mangadotnet
          - mangataro
          - mangavyvy
        # Weebcentral is a tolerated job (yellow, not red): its edge
        # rejects runner/datacenter IPs before the site's app runs —
        # a hard IP-reputation reject (403 in ~0.1s) with no detectable
        # challenge page in the response, so the runner can never
        # prove the provider wrong and no detector can skip it.
        # Verified green from residential IPs (local live checks +
        # manual testing).
        #
        # Mangaball needs no tolerance in this include: its managed
        # "Just a moment…" challenge is recognized by the suite
        # itself (edgeChallenge in internal/e2e), so its check skips
        # cleanly green whenever the runner IP is blocked. Any other
        # mangaball failure is therefore real information worth
        # seeing red. Revisit on evidence: if an edge behavior
        # changes, adjust the detector or move providers here.
        include:
          - provider: weebcentral
            edge_block_expected: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet live suite
        run: go vet -tags live ./internal/e2e

      - name: Run live health check
        env:
          GOWEEB_LIVE: "1"
        run: |
          go test -tags live ./internal/e2e \
            -run "TestLiveProvider/${{ matrix.provider }}$" \
            -count=1 -v -timeout 10m