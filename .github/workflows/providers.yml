name: Provider checks

# Live health checks for the source providers: every provider walks
# one real chapter through the whole PDF pipeline against its actual
# website (see internal/e2e). These are informational checks, not
# merge gates: runner IPs face bot protection on some sites, and
# live sites break for operational reasons that no code change can
# fix. They are never triggered on push or pull requests.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC, default branch only

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    name: ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    continue-on-error: ${{ matrix.edge_block_expected == true }}

    strategy:
      fail-fast: false
      matrix:
        provider:
          - animesama
          - atsumoe
          - mangafreak
          - weebcentral
          - mangadex
          - mangadotnet
          - mangavyvy
        # weebcentral rides behind Cloudflare bot protection that
        # rejects datacenter IPs at the edge (403 in ~0.1s), so its
        # job is tolerated for now (yellow, not red): the runner
        # can never prove the provider wrong, and the provider is
        # verified green from residential IPs. Revisit after the
        # browser header profile has proven itself against the
        # runner — then move weebcentral out of this include block.
        include:
          - provider: weebcentral
            edge_block_expected: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet live suite
        run: go vet -tags live ./internal/e2e

      - name: Run live health check
        env:
          GOWEEB_LIVE: "1"
        run: |
          go test -tags live ./internal/e2e \
            -run "TestLiveProvider/${{ matrix.provider }}$" \
            -count=1 -v -timeout 10m