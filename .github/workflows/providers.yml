name: Provider checks

# Live health checks for the source providers: every provider walks
# one real chapter through the whole PDF pipeline against its actual
# website (see internal/e2e). These are informational checks, not
# merge gates: runner IPs face bot protection on some sites, and
# live sites break for operational reasons that no code change can
# fix. They are never triggered on push or pull requests.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC, default branch only

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    name: ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    continue-on-error: ${{ matrix.edge_block_expected == true }}

    strategy:
      fail-fast: false
      matrix:
        provider:
          - animesama
          - atsumoe
          - mangafreak
          - weebcentral
          - mangadex
          - mangadotnet
          - mangavyvy
        # Weebcentral and mangaball are tolerated jobs (yellow, not
        # red): only failures WITHOUT the flag mean "a provider
        # broke". Both are Cloudflare-protected and their edge
        # refuses runner/datacenter IPs before the site's app runs —
        # the runner can never prove these providers wrong:
        # - weebcentral: hard IP-reputation reject (403 in ~0.1s). A
        #   browser header profile experiment did not convince the
        #   edge.
        # - mangaball: a managed "Just a moment…" JS challenge on the
        #   API routes, which no HTTP client can answer by design.
        # Both are verified green from residential IPs (local live
        # checks + manual testing). Revisit on evidence: if one stops
        # challenging runner IPs, move it back to a plain entry.
        include:
          - provider: weebcentral
            edge_block_expected: true
          - provider: mangaball
            edge_block_expected: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet live suite
        run: go vet -tags live ./internal/e2e

      - name: Run live health check
        env:
          GOWEEB_LIVE: "1"
        run: |
          go test -tags live ./internal/e2e \
            -run "TestLiveProvider/${{ matrix.provider }}$" \
            -count=1 -v -timeout 10m